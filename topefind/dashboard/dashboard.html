    <script type="text/javascript">
      const pyodideWorker = new Worker("./dashboard.js");
      pyodideWorker.busy = false
      pyodideWorker.queue = []
      
      let patching = 0
      
      function send_change(jsdoc, event) {
        if ((event.setter_id != null && event.setter_id == 'py') || (patching > 0)) {
          return
        } else if (pyodideWorker.busy && event.model && event.attr) {
          let events = []
          for (const old_event of pyodideWorker.queue) {
            if (!(old_event.model === event.model && old_event.attr === event.attr)) {
              events.push(old_event)
            }
          }
          events.push(event)
          pyodideWorker.queue = events
          return
        }
        const patch = jsdoc.create_json_patch([event])
        pyodideWorker.busy = true
        pyodideWorker.postMessage({type: 'patch', patch: patch})
      }
      
      pyodideWorker.onmessage = async (event) => {
        const msg = event.data
      
        const body = document.getElementsByTagName('body')[0]
        const loading_msgs = document.getElementsByClassName('pn-loading-msg')
        if (msg.type === 'idle') {
          if (pyodideWorker.queue.length) {
            const patch = pyodideWorker.jsdoc.create_json_patch(pyodideWorker.queue)
            pyodideWorker.busy = true
            pyodideWorker.queue = []
            pyodideWorker.postMessage({type: 'patch', patch: patch})
          } else {
            pyodideWorker.busy = false
          }
        } else if (msg.type === 'status') {
          let loading_msg
          if (loading_msgs.length) {
            loading_msg = loading_msgs[0]
          } else if (body.classList.contains('pn-loading')) {
            loading_msg = document.createElement('div')
            loading_msg.classList.add('pn-loading-msg')
            body.appendChild(loading_msg)
          }
          if (loading_msg != null) {
            loading_msg.innerHTML = msg.msg
          }
        } else if (msg.type === 'render') {
          const docs_json = JSON.parse(msg.docs_json)
          const render_items = JSON.parse(msg.render_items)
          const root_ids = JSON.parse(msg.root_ids)
      
          // Remap roots in message to element IDs
          const root_els = document.querySelectorAll('[data-root-id]')
          const data_roots = []
          for (const el of root_els) {
             el.innerHTML = ''
             data_roots.push([el.getAttribute('data-root-id'), el.id])
          }
          data_roots.sort((a, b) => a[0]<b[0] ? -1: 1)
          const roots = {}
          for (let i=0; i<data_roots.length; i++) {
            roots[root_ids[i]] = data_roots[i][1]
          }
          render_items[0]['roots'] = roots
          render_items[0]['root_ids'] = root_ids
      
          // Clear pre-rendered contents
          Bokeh.index.roots.map((v) => v.remove())
      
          // Embed content
          const [views] = await Bokeh.embed.embed_items(docs_json, render_items)
      
          // Remove loading spinner and message
          body.classList.remove("pn-loading", "arc")
          for (const loading_msg of loading_msgs) {
            loading_msg.remove()
          }
      
          // Setup bi-directional syncing
          pyodideWorker.jsdoc = jsdoc = [...views.roots.values()][0].model.document
          jsdoc.on_change(send_change.bind(null, jsdoc), false)
          pyodideWorker.postMessage({'type': 'rendered'})
          pyodideWorker.postMessage({'type': 'location', location: JSON.stringify(window.location)})
        } else if (msg.type === 'patch') {
          try {
            patching += 1
            pyodideWorker.jsdoc.apply_json_patch(msg.patch, msg.buffers)
          } finally {
            patching -= 1
          }
        }
      };
    </script>

5,10],"sizing_mode":"stretch_width","align":"start","text":"&amp;lt;h2 id=&amp;quot;welcome-to-topefinds-dashboard-&amp;quot;&amp;gt;Welcome to Topefind&amp;#x27;s dashboard \ud83d\ude80 &amp;lt;a class=&amp;quot;header-anchor&amp;quot; href=&amp;quot;#welcome-to-topefinds-dashboard-&amp;quot;&amp;gt;\u00b6&amp;lt;/a&amp;gt;&amp;lt;/h2&amp;gt;\n"}}]}},{"type":"object","name":"panel.models.markup.HTML","id":"p1018","attributes":{"css_classes":["markdown"],"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"p1008"},{"id":"p1017"},{"id":"p1083"}],"min_width":0,"margin":[10,10],"sizing_mode":"stretch_width","align":"start","text":"&amp;lt;p&amp;gt;This dashboard allows you to explore antibody by antibody, residue by residue, model by model the predictions\non a given result dataset on the paratope prediction task.\nThe box plot with different regions, exposes the chosen metric from the Controls panel across the regions.\nThe radar plot instead shows the performance of the chosen configuration across different preselected metrics.\nTwo more plots help visualizing performance, the scatter plot highlights chain by chain how two selected models\nfrom the configuration perform. A linear relationship here indicates that the models behave similarly with\nrespect to the chosen metric on the considered dataset. A violin plot helps visualize the distribution of the\nmetric across antibody chains in the dataset. Finally, two tabs explore how the labels and the models behave\nwith respect to one another, directly on the 3D representation of the protein.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;How does this work?&amp;lt;/p&amp;gt;\n&amp;lt;ul&amp;gt;\n&amp;lt;li&amp;gt;A file &amp;lt;code&amp;gt;benchmark.pkl.gz&amp;lt;/code&amp;gt; encodes the results on a given dataset. This file is a Pandas DataFrame that\ncontains the results. This can be created with a benchmarker from &amp;lt;code&amp;gt;topefind.benchmarkers&amp;lt;/code&amp;gt; on a given\ntrain, validation, or test set.&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;There are several .bcif files that are served together, these need to match the structures that correspond to\nthe PDB id exposed in the pdb column of &amp;lt;code&amp;gt;benchmark.pkl.gz&amp;lt;/code&amp;gt;.&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;The app is serverless if converted to pyodide-worker, pyodide or pyscript. I suggest converting to\npyodide-worker as it&amp;#x27;s the most stable or running it from python with panel.&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;\n&amp;lt;p&amp;gt;List of current issues and ugly fixes:&amp;lt;/p&amp;gt;\n&amp;lt;ul&amp;gt;\n&amp;lt;li&amp;gt;The layout is not adaptable to all screen sizes, especially for mobile, desktop is recommended.&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;Some Panel Rows grow a bit more than necessary for some screen sizes, if they don&amp;#x27;t render correctly zoom out.&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;The PDBeMolstar plugin does not fully expand sometimes (just trigger the controls button, and it will reset).&amp;lt;/li&amp;gt;\n&amp;lt;li&amp;gt;The PDBeMolstar has some troubles with the IMGT annotated structures, it might wrongly cartoon some residues\nother visual styles render correctly.&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;\n&amp;lt;p&amp;gt;If you find any other problems or solutions please open an issue under\n&amp;lt;a href=&amp;quot;https://github.com/bayer-science-for-a-better-life/topefind-public/issues&amp;quot;&amp;gt;topefind&amp;#x27;s issues&amp;lt;/a&amp;gt;&amp;lt;/p&amp;gt;\n"}}],"button_css_classes":["card-button"],"collapsed":false,"header_background":"","header_color":"","header_css_classes":["card-header"]}},{"type":"object","name":"Div","id":"p1022","attributes":{"name":"main-13073470544","tags":["main"],"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n
